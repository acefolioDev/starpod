name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify framework
        run: bun run check

      - name: Verify release build
        run: bun run build

      - name: Verify generated application types
        run: bunx tsc --noEmit -p template/tsconfig.json

      - name: Verify package contents
        run: bun pm pack --dry-run

      - name: Verify packed package in a clean consumer
        run: bun run test:package
